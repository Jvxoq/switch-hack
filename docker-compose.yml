# Tripwire stack: self-hosted Langfuse, the containment service, the detector and a one-shot demo agent.
# Setup: cp .env.example .env && scripts/bootstrap_langfuse.sh && docker compose up -d
# Only the Langfuse UI (3000) and containment (8700) are published, both on 127.0.0.1.
# Langfuse's internal services (postgres, clickhouse, redis, minio) are not published to the host.

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run scripts/bootstrap_langfuse.sh first}
  SALT: ${SALT:?run scripts/bootstrap_langfuse.sh first}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run scripts/bootstrap_langfuse.sh first}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?run scripts/bootstrap_langfuse.sh first}@postgres:5432/${POSTGRES_DB:-postgres}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run scripts/bootstrap_langfuse.sh first}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?run scripts/bootstrap_langfuse.sh first}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run scripts/bootstrap_langfuse.sh first}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run scripts/bootstrap_langfuse.sh first}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  TELEMETRY_ENABLED: "false"

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    restart: always
    depends_on: &langfuse-deps
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - 127.0.0.1:3000:3000
    environment:
      <<: *langfuse-env
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    restart: always
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run scripts/bootstrap_langfuse.sh first}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    # Creates the 'langfuse' bucket before starting the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/bootstrap_langfuse.sh first}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:?run scripts/bootstrap_langfuse.sh first}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:?run scripts/bootstrap_langfuse.sh first}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/bootstrap_langfuse.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Containment: the only writer of incidents.json and flags.json. One worker only (the write lock is per process).
  containment:
    build: .
    image: tripwire:local
    restart: unless-stopped
    command: ["uvicorn", "--factory", "tripwire.containment.app:create_default_app",
              "--host", "0.0.0.0", "--port", "8700", "--workers", "1",
              "--timeout-keep-alive", "75"]
    environment:
      TRIPWIRE_CONFIG: /app/tripwire.yaml
      TRIPWIRE_STATE_DIR: /state
    ports:
      - 127.0.0.1:8700:8700
    volumes:
      - tripwire_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/flags', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Detector. It shares containment's network namespace so that tripwire.yaml's
  # containment_url (http://127.0.0.1:8700) works unchanged. Langfuse is reached by its service name.
  detector:
    build: .
    image: tripwire:local
    network_mode: service:containment
    restart: unless-stopped
    depends_on:
      containment:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    command: ["python", "-m", "tripwire.detector", "--config", "/app/tripwire.yaml",
              "--records", "/state/incident-records.md"]
    environment:
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?run scripts/bootstrap_langfuse.sh first}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?run scripts/bootstrap_langfuse.sh first}
      SWITCH_DRY_RUN: ${SWITCH_DRY_RUN:-1}
      SWITCH_PATH: ${SWITCH_PATH:-agent}
      SWITCH_BASE_URL: ${SWITCH_BASE_URL:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID:-}
      SWITCH_TOKEN: ${SWITCH_TOKEN:-}
      SWITCH_STATUS_MODE: ${SWITCH_STATUS_MODE:-reply}
    volumes:
      - tripwire_state:/state

  # One-shot demo agent: runs the order-lookup agent with one bug switched on, then exits.
  # Traces go to Langfuse. Online runs need a real ANTHROPIC_API_KEY and ANTHROPIC_MODEL in .env.
  demo-agent:
    build: .
    image: tripwire:local
    restart: "no"
    depends_on:
      containment:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    command: ["python", "-m", "demo_agent", "run", "--bug", "${DEMO_BUG:-loop}", "--n", "${DEMO_RUNS:-10}"]
    environment:
      TRIPWIRE_CONTAINMENT_URL: http://containment:8700
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?run scripts/bootstrap_langfuse.sh first}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?run scripts/bootstrap_langfuse.sh first}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}

volumes:
  tripwire_state:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
